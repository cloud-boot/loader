# cloud-boot/loader — pure-UEFI variant build pipeline.
#
# Mirrors go-coff/stub's three-step recipe (TinyGo → COFF object, clang
# → COFF asm thunk, lld-link → PE/EFI). Stays minimal on purpose:
# phase 0 only builds the diagnostic probe; phase 1+ will add the
# real cloud-boot pure-UEFI binary alongside it.

version: '3'

vars:
  PROBE_AMD64_OUT: BOOTX64-probe.EFI
  PROBE_ARM64_OUT: BOOTAA64-probe.EFI
  AMD64_TARGET:    targets/uefi-amd64.json
  ARM64_TARGET:    targets/uefi-arm64.json

tasks:

  # ----- probe (phase 0) --------------------------------------------------

  probe-thunk-arm64:
    desc: Assemble the arm64 EFI calling-convention thunk.
    dir: cmd/efi-probe
    sources: [thunk-arm64.S]
    generates: [thunk-arm64.o]
    cmds:
      - clang -target aarch64-pc-windows-gnu -c thunk-arm64.S -o thunk-arm64.o

  probe-thunk-amd64:
    desc: Assemble the amd64 EFI calling-convention thunk.
    dir: cmd/efi-probe
    sources: [thunk-amd64.S]
    generates: [thunk-amd64.o]
    cmds:
      - clang -target x86_64-pc-windows-gnu -c thunk-amd64.S -o thunk-amd64.o

  probe-compile-arm64:
    desc: TinyGo-compile the probe for arm64-UEFI.
    deps: [probe-thunk-arm64]
    dir: cmd/efi-probe
    sources:
      - main.go
      - '../../{{.ARM64_TARGET}}'
    generates: [main-arm64.o]
    cmds:
      - tinygo build -target=../../{{.ARM64_TARGET}} -o main-arm64.o .

  probe-compile-amd64:
    desc: TinyGo-compile the probe for amd64-UEFI.
    deps: [probe-thunk-amd64]
    dir: cmd/efi-probe
    sources:
      - main.go
      - '../../{{.AMD64_TARGET}}'
    generates: [main-amd64.o]
    cmds:
      - tinygo build -target=../../{{.AMD64_TARGET}} -o main-amd64.o .

  probe-arm64:
    desc: 'Build the arm64 probe → {{.PROBE_ARM64_OUT}}.'
    deps: [probe-compile-arm64]
    dir: cmd/efi-probe
    cmds:
      - >-
        lld-link
        /machine:arm64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.PROBE_ARM64_OUT}}
        main-arm64.o thunk-arm64.o
      - file {{.PROBE_ARM64_OUT}}

  probe-amd64:
    desc: 'Build the amd64 probe → {{.PROBE_AMD64_OUT}}.'
    deps: [probe-compile-amd64]
    dir: cmd/efi-probe
    cmds:
      - >-
        lld-link
        /machine:x64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.PROBE_AMD64_OUT}}
        main-amd64.o thunk-amd64.o
      - file {{.PROBE_AMD64_OUT}}

  probe:
    desc: Build the probe for both arches.
    deps: [probe-arm64, probe-amd64]

  # ----- run the probe under QEMU OVMF + Apple VZ --------------------------
  # qemu-probe-* boots the probe under OVMF (where we expect a richer
  # protocol surface — OVMF is built with NETWORK_HTTP_BOOT by default
  # on most distros). vz-probe-arm64 builds a FAT image + boots through
  # the existing `vzd vz-provision` flow so we get the same firmware
  # surface a real cloud-boot run would see.

  qemu-probe-arm64:
    desc: Boot the probe under qemu-system-aarch64 / OVMF.
    deps: [probe-arm64]
    dir: cmd/efi-probe
    cmds:
      # The empty FAT we stash the probe into mirrors what go-coff/stub
      # does for its qemu tests. mkesp comes from go-coff/stub.
      - >-
        go run ../../../../go-coff/stub/cmd/mkesp
        -o esp.img -size 4M -file {{.PROBE_ARM64_OUT}}=EFI/BOOT/BOOTAA64.EFI
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 1024 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img
        -netdev user,id=n0 -device virtio-net-device,netdev=n0
        -nographic -serial mon:stdio

  clean:
    cmds:
      - rm -f cmd/efi-probe/*.o cmd/efi-probe/*.EFI cmd/efi-probe/esp.img cmd/efi-probe/ovmf_vars_arm64.fd
