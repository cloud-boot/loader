# cloud-boot/loader — pure-UEFI variant build pipeline.
#
# Mirrors go-coff/stub's three-step recipe (TinyGo → COFF object, clang
# → COFF asm thunk, lld-link → PE/EFI). Stays minimal on purpose:
# phase 0 only builds the diagnostic probe; phase 1+ will add the
# real cloud-boot pure-UEFI binary alongside it.

version: '3'

vars:
  PROBE_AMD64_OUT:      BOOTX64-probe.EFI
  PROBE_ARM64_OUT:      BOOTAA64-probe.EFI
  LOADER_AMD64_OUT:     BOOTX64.EFI
  LOADER_ARM64_OUT:     BOOTAA64.EFI
  DISK_PROBE_AMD64_OUT: BOOTX64-disk-probe.EFI
  DISK_PROBE_ARM64_OUT: BOOTAA64-disk-probe.EFI
  AMD64_TARGET:         targets/uefi-amd64.json
  ARM64_TARGET:         targets/uefi-arm64.json
  DEBIAN_RAW:           '{{.TASKFILE_DIR}}/../uki/.debian-cache/trixie/arm64/genericcloud.labeled.raw'
  ALMA_RAW:             '{{.TASKFILE_DIR}}/../uki/.alma-cache/9/arm64/genericcloud.raw'
  FEDORA_RAW:           '{{.TASKFILE_DIR}}/../uki/.fedora-cache/41/arm64/genericcloud.raw'
  UBUNTU_RAW:           '{{.TASKFILE_DIR}}/../uki/.ubuntu-cache/noble/arm64/genericcloud.raw'
  MICROOS_RAW:          '{{.TASKFILE_DIR}}/../uki/.suse-cache/microos/arm64/microos.raw'

tasks:

  # ----- probe (phase 0) --------------------------------------------------

  probe-thunk-arm64:
    desc: Assemble the arm64 EFI calling-convention thunk.
    dir: cmd/efi-probe
    sources: [thunk-arm64.S]
    generates: [thunk-arm64.o]
    cmds:
      - clang -target aarch64-pc-windows-gnu -c thunk-arm64.S -o thunk-arm64.o

  probe-thunk-amd64:
    desc: Assemble the amd64 EFI calling-convention thunk.
    dir: cmd/efi-probe
    sources: [thunk-amd64.S]
    generates: [thunk-amd64.o]
    cmds:
      - clang -target x86_64-pc-windows-gnu -c thunk-amd64.S -o thunk-amd64.o

  probe-compile-arm64:
    desc: TinyGo-compile the probe for arm64-UEFI.
    deps: [probe-thunk-arm64]
    dir: cmd/efi-probe
    sources:
      - main.go
      - '../../{{.ARM64_TARGET}}'
    generates: [main-arm64.o]
    cmds:
      - tinygo build -target=../../{{.ARM64_TARGET}} -o main-arm64.o .

  probe-compile-amd64:
    desc: TinyGo-compile the probe for amd64-UEFI.
    deps: [probe-thunk-amd64]
    dir: cmd/efi-probe
    sources:
      - main.go
      - '../../{{.AMD64_TARGET}}'
    generates: [main-amd64.o]
    cmds:
      - tinygo build -target=../../{{.AMD64_TARGET}} -o main-amd64.o .

  probe-arm64:
    desc: 'Build the arm64 probe → {{.PROBE_ARM64_OUT}}.'
    deps: [probe-compile-arm64]
    dir: cmd/efi-probe
    cmds:
      - >-
        lld-link
        /machine:arm64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.PROBE_ARM64_OUT}}
        main-arm64.o thunk-arm64.o
      - file {{.PROBE_ARM64_OUT}}

  probe-amd64:
    desc: 'Build the amd64 probe → {{.PROBE_AMD64_OUT}}.'
    deps: [probe-compile-amd64]
    dir: cmd/efi-probe
    cmds:
      - >-
        lld-link
        /machine:x64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.PROBE_AMD64_OUT}}
        main-amd64.o thunk-amd64.o
      - file {{.PROBE_AMD64_OUT}}

  probe:
    desc: Build the probe for both arches.
    deps: [probe-arm64, probe-amd64]

  # ----- run the probe under QEMU OVMF + Apple VZ --------------------------
  # qemu-probe-* boots the probe under OVMF (where we expect a richer
  # protocol surface — OVMF is built with NETWORK_HTTP_BOOT by default
  # on most distros). vz-probe-arm64 builds a FAT image + boots through
  # the existing `vzd vz-provision` flow so we get the same firmware
  # surface a real cloud-boot run would see.

  qemu-probe-arm64:
    desc: Boot the probe under qemu-system-aarch64 / OVMF.
    deps: [probe-arm64]
    dir: cmd/efi-probe
    cmds:
      # The empty FAT we stash the probe into mirrors what go-coff/stub
      # does for its qemu tests. mkesp comes from go-coff/stub.
      - >-
        go run ../../../../go-coff/stub/cmd/mkesp
        -o esp.img -size 4M -file {{.PROBE_ARM64_OUT}}=EFI/BOOT/BOOTAA64.EFI
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 1024 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img
        -netdev user,id=n0 -device virtio-net-device,netdev=n0
        -nographic -serial mon:stdio

  # ----- loader (phase 5a — disk-mode) ------------------------------------

  loader-thunk-arm64:
    desc: Assemble the arm64 EFI calling-convention thunk for the loader.
    dir: cmd/efi-loader
    sources: [thunk-arm64.S]
    generates: [thunk-arm64.o]
    cmds:
      - clang -target aarch64-pc-windows-gnu -c thunk-arm64.S -o thunk-arm64.o

  loader-thunk-amd64:
    desc: Assemble the amd64 EFI calling-convention thunk for the loader.
    dir: cmd/efi-loader
    sources: [thunk-amd64.S]
    generates: [thunk-amd64.o]
    cmds:
      - clang -target x86_64-pc-windows-gnu -c thunk-amd64.S -o thunk-amd64.o

  loader-compile-arm64:
    desc: TinyGo-compile the disk-mode loader for arm64-UEFI.
    deps: [loader-thunk-arm64]
    dir: cmd/efi-loader
    sources:
      - '*.go'
      - '../../{{.ARM64_TARGET}}'
    generates: [main-arm64.o]
    cmds:
      - tinygo build -target=../../{{.ARM64_TARGET}} -o main-arm64.o .

  loader-compile-amd64:
    desc: TinyGo-compile the disk-mode loader for amd64-UEFI.
    deps: [loader-thunk-amd64]
    dir: cmd/efi-loader
    sources:
      - '*.go'
      - '../../{{.AMD64_TARGET}}'
    generates: [main-amd64.o]
    cmds:
      - tinygo build -target=../../{{.AMD64_TARGET}} -o main-amd64.o .

  loader-arm64:
    desc: 'Build the arm64 disk-mode loader → {{.LOADER_ARM64_OUT}}.'
    deps: [loader-compile-arm64]
    dir: cmd/efi-loader
    cmds:
      - >-
        lld-link
        /machine:arm64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.LOADER_ARM64_OUT}}
        main-arm64.o thunk-arm64.o
      - file {{.LOADER_ARM64_OUT}}

  loader-amd64:
    desc: 'Build the amd64 disk-mode loader → {{.LOADER_AMD64_OUT}}.'
    deps: [loader-compile-amd64]
    dir: cmd/efi-loader
    cmds:
      - >-
        lld-link
        /machine:x64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.LOADER_AMD64_OUT}}
        main-amd64.o thunk-amd64.o
      - file {{.LOADER_AMD64_OUT}}

  loader:
    desc: Build the disk-mode loader for both arches.
    deps: [loader-arm64, loader-amd64]

  # qemu-loader-arm64 builds a 64-MiB FAT32 ESP carrying the loader at
  # /EFI/BOOT/BOOTAA64.EFI plus a chain-loadable EFI binary at
  # /EFI/Linux/cloud-boot.efi — the canonical path the loader walks
  # for. UKI_PATH defaults to the probe binary, which is small and
  # produces a clear stdout trail. Override to chain a real UKI:
  #
  #   UKI_PATH=../../uki/out/uki-aa64.efi task qemu-loader-arm64
  #
  # The OVMF varstore is wiped on every run — OVMF caches a Boot0001
  # entry across reboots that points at the *previous* ESP and will
  # short-circuit the removable-media fallback unless reset.
  efivar-stage:
    desc: Build the host-side OVMF varstore staging tool.
    dir: cmd/efivar-stage
    sources: [main.go, go.mod]
    generates: [efivar-stage]
    cmds:
      - go build -o efivar-stage .

  qemu-loader-arm64:
    desc: Boot the disk-mode loader under qemu-system-aarch64 / OVMF.
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    vars:
      UKI_PATH: '{{.UKI_PATH | default "../efi-probe/BOOTAA64-probe.EFI"}}'
      # CMDLINE is staged into the OVMF varstore via efivar-stage; the
      # loader picks it up via RuntimeServices.GetVariable. Override to
      # exercise the real kernel cmdline you'd want a UKI to receive.
      CMDLINE: '{{.CMDLINE | default "cloud-boot: hello from CloudBootCmdline EFI var"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      # FAT32 needs ≥ 32 MiB to stay above the cluster-count floor that
      # OVMF's PartitionDxe requires; pick 64 MiB to leave headroom.
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT ::EFI/Linux"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - >-
        if [ -f "{{.UKI_PATH}}" ]; then
          mcopy -i esp.img "{{.UKI_PATH}}" ::EFI/Linux/cloud-boot.efi;
          echo "Staged UKI from {{.UKI_PATH}}";
        else
          echo "WARNING: {{.UKI_PATH}} not found — loader will report 'no UKI found'";
        fi
      # Stage CloudBootCmdline into the OVMF varstore. The loader's
      # readCmdlineEFIVar (RuntimeServices.GetVariable) picks it up
      # at boot.
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 1024 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img
        -netdev user,id=n0 -device virtio-net-device,netdev=n0
        -nographic -serial mon:stdio

  # ----- disk-probe (phase 5d step 1) -------------------------------------

  disk-probe-thunk-arm64:
    desc: Assemble the arm64 thunk for disk-probe.
    dir: cmd/disk-probe
    sources: [thunk-arm64.S]
    generates: [thunk-arm64.o]
    cmds:
      - clang -target aarch64-pc-windows-gnu -c thunk-arm64.S -o thunk-arm64.o

  disk-probe-compile-arm64:
    desc: TinyGo-compile the disk-probe for arm64-UEFI.
    deps: [disk-probe-thunk-arm64]
    dir: cmd/disk-probe
    sources:
      - main.go
      - '../../{{.ARM64_TARGET}}'
    generates: [main-arm64.o]
    cmds:
      - tinygo build -target=../../{{.ARM64_TARGET}} -o main-arm64.o .

  disk-probe-arm64:
    desc: 'Build the arm64 disk-probe → {{.DISK_PROBE_ARM64_OUT}}.'
    deps: [disk-probe-compile-arm64]
    dir: cmd/disk-probe
    cmds:
      - >-
        lld-link
        /machine:arm64
        /subsystem:efi_application
        /entry:_start
        /nodefaultlib
        /force:unresolved
        /base:0x10000
        /out:{{.DISK_PROBE_ARM64_OUT}}
        main-arm64.o thunk-arm64.o
      - file {{.DISK_PROBE_ARM64_OUT}}

  # qemu-disk-probe-arm64: boot the disk-probe with the Debian Trixie
  # arm64 cloud image attached as a second virtio block device — that's
  # the real partitioned ext4 layout we'll have to read in Phase 5d.
  qemu-disk-probe-arm64:
    desc: Run disk-probe under QEMU with the Debian cloud image attached.
    deps: [disk-probe-arm64]
    dir: cmd/disk-probe
    preconditions:
      - sh: 'test -f "{{.DEBIAN_RAW}}"'
        msg: 'Debian cloud image missing — run `ARCH=arm64 task -t ../../uki/Taskfile.yaml label:debian:cloud` first.'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.DISK_PROBE_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      # Use a qcow2 overlay on top of the raw image so the cloud
      # image stays read-only on disk while Linux gets a writable
      # virtio drive (ext4 journal replay needs that). The overlay
      # is recreated on every run.
      - rm -f cloud-overlay.qcow2
      - qemu-img create -f qcow2 -F raw -b {{.DEBIAN_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 1024 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-disk-probe-microos-arm64: same disk-probe but pointed at the
  # openSUSE MicroOS arm64 cloud image — exercises the btrfs path
  # (sys_chunk_array → root tree → FS_TREE → subvol scan).
  qemu-disk-probe-microos-arm64:
    desc: Run disk-probe under QEMU with the openSUSE MicroOS arm64 cloud image attached.
    deps: [disk-probe-arm64]
    dir: cmd/disk-probe
    preconditions:
      - sh: 'test -f "{{.MICROOS_RAW}}"'
        msg: 'openSUSE MicroOS cloud image missing — fetch into ../uki/.suse-cache/microos/arm64/microos.raw first.'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.DISK_PROBE_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - qemu-img create -f qcow2 -F raw -b {{.MICROOS_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 2048 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-loader-alma-arm64: production loader vs an unmodified
  # AlmaLinux 9 cloud image — exercises the xfs path in xfs.go.
  qemu-loader-alma-arm64:
    desc: Boot the loader against an unmodified AlmaLinux 9 arm64 cloud image (xfs path).
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.ALMA_RAW}}"'
        msg: 'AlmaLinux cloud image missing — fetch it first with curl into ../uki/.alma-cache/9/arm64/genericcloud.raw'
    vars:
      # AlmaLinux's stock initrd uses dracut + UUID lookups; the
      # easiest cmdline for a quick bring-up references /dev/vda3
      # directly (the third partition on the GenericCloud aarch64
      # layout). Override CMDLINE=… for a different setup.
      CMDLINE: '{{.CMDLINE | default "console=ttyAMA0 root=/dev/vda3 ro"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - qemu-img create -f qcow2 -F raw -b {{.ALMA_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 2048 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-loader-ubuntu-arm64: production loader vs an unmodified
  # Ubuntu Noble cloud image — exercises the ext4 walker with a
  # Debian-style single-partition layout.
  qemu-loader-ubuntu-arm64:
    desc: Boot the loader against an unmodified Ubuntu Noble arm64 cloud image.
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.UBUNTU_RAW}}"'
        msg: 'Ubuntu cloud image missing — fetch into ../uki/.ubuntu-cache/noble/arm64/genericcloud.raw first.'
    vars:
      CMDLINE: '{{.CMDLINE | default "console=ttyAMA0 root=LABEL=cloudimg-rootfs ro"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - qemu-img create -f qcow2 -F raw -b {{.UBUNTU_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 2048 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-loader-fedora-arm64: production loader vs an unmodified
  # Fedora 41 cloud image. Layout: ESP (FAT) + /boot (ext4, dedicated)
  # + / (btrfs). The ext4 walker now also probes the partition's own
  # root for vmlinuz-*, so a separate /boot partition Just Works.
  qemu-loader-fedora-arm64:
    desc: Boot the loader against an unmodified Fedora 41 arm64 cloud image.
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.FEDORA_RAW}}"'
        msg: 'Fedora cloud image missing — fetch it into ../uki/.fedora-cache/41/arm64/genericcloud.raw first.'
    vars:
      CMDLINE: '{{.CMDLINE | default "console=ttyAMA0 root=/dev/vda5 ro"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - qemu-img create -f qcow2 -F raw -b {{.FEDORA_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 2048 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-loader-microos-arm64: production loader vs an unmodified
  # openSUSE MicroOS arm64 cloud image — exercises the btrfs path
  # (default subvol resolution + depth-N B-tree walker + Image-*
  # kernel discovery).
  qemu-loader-microos-arm64:
    desc: Boot the loader against an unmodified openSUSE MicroOS arm64 cloud image (btrfs path).
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.MICROOS_RAW}}"'
        msg: 'openSUSE MicroOS cloud image missing — fetch into ../uki/.suse-cache/microos/arm64/microos.raw first.'
    vars:
      # MicroOS uses LABEL=ROOT for the root btrfs volume + a default
      # subvol indirection. Override CMDLINE=… for a different setup.
      CMDLINE: '{{.CMDLINE | default "console=ttyAMA0 root=LABEL=ROOT ro"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - qemu-img create -f qcow2 -F raw -b {{.MICROOS_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 2048 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # qemu-loader-cloud-arm64: production loader vs an unmodified Debian
  # cloud image. No UKI staged on the FAT ESP → loader falls through
  # to the ext4 path and boots the kernel inside /boot of the cloud
  # image's rootfs partition. CMDLINE defaults to "console=ttyAMA0
  # root=LABEL=cloudimg-rootfs ro" — override to taste.
  qemu-loader-cloud-arm64:
    desc: Boot the loader against an unmodified Debian cloud image (no UKI staged → ext4 fallback).
    deps: [loader-arm64, efivar-stage]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.DEBIAN_RAW}}"'
        msg: 'Debian cloud image missing — run `ARCH=arm64 task -t ../../uki/Taskfile.yaml label:debian:cloud` first.'
    vars:
      CMDLINE: '{{.CMDLINE | default "console=ttyAMA0 root=LABEL=cloudimg-rootfs ro"}}'
    cmds:
      - rm -f esp.img ovmf_vars_arm64.fd cloud-overlay.qcow2
      - dd if=/dev/zero of=ovmf_vars_arm64.fd bs=1M count=64 status=none
      - dd if=/dev/zero of=esp.img bs=1M count=64 status=none
      - "mformat -i esp.img -F ::"
      - "mmd -i esp.img ::EFI ::EFI/BOOT"
      - "mcopy -i esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI"
      - ../efivar-stage/efivar-stage -store ovmf_vars_arm64.fd -cmdline "{{.CMDLINE}}"
      - qemu-img create -f qcow2 -F raw -b {{.DEBIAN_RAW}} cloud-overlay.qcow2 > /dev/null
      - >-
        qemu-system-aarch64
        -machine virt,gic-version=max,accel=hvf:tcg -cpu max -m 1024 -smp 2
        -drive if=pflash,format=raw,readonly=on,file=/opt/homebrew/share/qemu/edk2-aarch64-code.fd
        -drive if=pflash,format=raw,file=ovmf_vars_arm64.fd
        -drive if=virtio,format=raw,file=esp.img,id=esp
        -drive if=virtio,format=qcow2,file=cloud-overlay.qcow2,id=cloud
        -nographic -serial mon:stdio

  # vfkit-loader-cloud-arm64: production loader on real Apple
  # Virtualization.framework via vfkit (Red Hat / crc-org). Same
  # ext4 cloud-disk fallback as qemu-loader-cloud-arm64, but
  # exercised under Apple's UEFI implementation instead of OVMF —
  # which is the entire reason the loader exists (kexec_file_load
  # is trapped under VZ).
  #
  # Apple's UEFI routes SimpleTextOutput to the framebuffer only,
  # so we can't see the loader's writeASCII traffic. Instead we
  # rely on:
  #   1. CloudBootMark non-volatile EFI variable (set as the very
  #      first thing in _start), inspectable in the resulting
  #      efi-vars.fd after the VM stops.
  #   2. Linux kernel writing to virtio-serial once started (the
  #      \cmdline file embedded in the modified ESP carries
  #      console=hvc0).
  #
  # The Debian image is mutated in-place: ESP partition extracted,
  # our BOOTAA64.EFI overlaid at \EFI\BOOT\BOOTAA64.EFI alongside
  # a \cmdline file, then written back. After the run inspect
  # /tmp/vz-test/vfkit/serial-mod.log for kernel output and
  # /tmp/vz-test/vfkit/efi-vars-mod.fd for the marker variable.
  vfkit-loader-cloud-arm64:
    desc: Boot the production loader on real Apple Virtualization.framework via vfkit.
    deps: [loader-arm64]
    dir: cmd/efi-loader
    preconditions:
      - sh: 'test -f "{{.DEBIAN_RAW}}"'
        msg: 'Debian cloud image missing — fetch it first with `ARCH=arm64 task -t ../../uki/Taskfile.yaml label:debian:cloud`.'
      - sh: 'which vfkit > /dev/null'
        msg: 'vfkit not installed — run `brew install vfkit` first.'
    vars:
      CMDLINE: '{{.CMDLINE | default "console=hvc0 root=LABEL=cloudimg-rootfs ro"}}'
      VZTEST:  /tmp/vz-test
    cmds:
      - mkdir -p {{.VZTEST}}/vfkit
      # Copy the raw Debian cloud image into a writable working copy.
      - cp {{.DEBIAN_RAW}} {{.VZTEST}}/debian.raw
      # Extract the ESP (GPT partition 15 on Debian arm64
      # genericcloud: starts at LBA 2048, runs 260096 sectors =
      # 127 MiB), overlay our loader + cmdline, write back.
      - dd if={{.VZTEST}}/debian.raw of={{.VZTEST}}/esp.img bs=512 skip=2048 count=260096 status=none
      - mcopy -o -i {{.VZTEST}}/esp.img {{.LOADER_ARM64_OUT}} ::EFI/BOOT/BOOTAA64.EFI
      - echo -n "{{.CMDLINE}}" > {{.VZTEST}}/cmdline.txt
      - mcopy -o -i {{.VZTEST}}/esp.img {{.VZTEST}}/cmdline.txt ::cmdline
      - dd if={{.VZTEST}}/esp.img of={{.VZTEST}}/debian.raw bs=512 seek=2048 count=260096 conv=notrunc status=none
      # Fresh varstore on every run — the previous run's
      # CloudBootMark variable would otherwise persist and obscure
      # what THIS run did.
      - rm -f {{.VZTEST}}/vfkit/efi-vars.fd {{.VZTEST}}/vfkit/serial.log
      - >-
        vfkit --cpus 2 --memory 2048
        --bootloader efi,variable-store={{.VZTEST}}/vfkit/efi-vars.fd,create
        --device virtio-blk,path={{.VZTEST}}/debian.raw
        --device virtio-serial,logFilePath={{.VZTEST}}/vfkit/serial.log
        --device virtio-rng
        --device virtio-net,nat,mac=72:20:43:d4:38:01
        --gui

  clean:
    cmds:
      - rm -f cmd/efi-probe/*.o cmd/efi-probe/*.EFI cmd/efi-probe/esp.img cmd/efi-probe/ovmf_vars_arm64.fd
      - rm -f cmd/disk-probe/*.o cmd/disk-probe/*.EFI cmd/disk-probe/esp.img cmd/disk-probe/ovmf_vars_arm64.fd cmd/disk-probe/cloud-overlay.qcow2
      - rm -f cmd/efi-loader/*.o cmd/efi-loader/*.EFI cmd/efi-loader/esp.img cmd/efi-loader/ovmf_vars_arm64.fd cmd/efi-loader/cloud-overlay.qcow2
      - rm -rf cmd/efi-loader/esp-stage cmd/efi-loader/esp-loader.iso
      - rm -f cmd/efivar-stage/efivar-stage
